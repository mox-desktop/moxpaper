[package]
name = "libmoxpaper"
version = "0.1.0"
edition = "2024"

[features]
default = []
server = []
client = []
s3 = []
http = []

[dependencies]
anyhow = { version = "1.0.98", default-features = false }
serde_json = "1.0.140"
serde = { version = "1.0.219", features = ["rc"], default-features = false }
clap = { version = "4.5.37", features = ["derive", "wrap_help", "env"] }
moxui = { git = "https://forgejo.r0chd.pl/mox-desktop/moxui.git", rev = "ffb20cdc438c93976b54dfce1138a765f2fd8cc1", default-features = false, features = ["texture_renderer"] }
